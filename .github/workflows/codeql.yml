name: CodeQL Security Analysis

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    - cron: '0 6 * * 1'

jobs:
  analyze:
    name: Analyze (Swift)
    # 当前 Swift/CodeQL 组合会长期卡在构建阶段，先跳过这条检查，待上游和工作流适配后再恢复。
    if: ${{ false }}
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    permissions:
      security-events: write
      contents: read
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Select pinned Xcode
        run: |
          if [[ ! -d "$DEVELOPER_DIR" ]]; then
            echo "Expected Xcode not found: $DEVELOPER_DIR"
            ls -d /Applications/Xcode*.app || true
            exit 1
          fi
          xcodebuild -version

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: swift
          queries: security-and-quality

      - name: Build
        run: |
          xcodebuild build \
            -project GdeiAssistant-iOS.xcodeproj \
            -scheme GdeiAssistant-iOS \
            -destination 'generic/platform=iOS Simulator' \
            -xcconfig .github/ci-overrides.xcconfig \
            CODE_SIGNING_ALLOWED=NO \
            | tail -20

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:swift"
