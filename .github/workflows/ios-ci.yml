name: iOS CI

on:
  push:
    branches:
      - main
      - master
      - 'release/**'
  pull_request:
    branches:
      - main
      - master
      - 'release/**'

jobs:
  style-check:
    name: Style Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run Swift style checks
        run: |
          chmod +x Tools/check_style.sh
          ./Tools/check_style.sh

  build-smoke:
    name: Build Smoke
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Select pinned Xcode
        run: |
          if [[ ! -d "$DEVELOPER_DIR" ]]; then
            echo "Expected Xcode not found: $DEVELOPER_DIR"
            ls -d /Applications/Xcode*.app || true
            exit 1
          fi
          xcodebuild -version

      - name: Build simulator app
        run: |
          chmod +x Tools/build_simulator.sh
          ./Tools/build_simulator.sh

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-build-log
          path: build-simulator.log
          retention-days: 3

  unit-test:
    name: Unit Tests
    runs-on: macos-26
    timeout-minutes: 40
    needs:
      - style-check
      - build-smoke
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Select pinned Xcode and list simulators
        run: |
          if [[ ! -d "$DEVELOPER_DIR" ]]; then
            echo "Expected Xcode not found: $DEVELOPER_DIR"
            ls -d /Applications/Xcode*.app || true
            exit 1
          fi
          xcodebuild -version
          xcrun simctl list devices available iPhone

      - name: Run unit tests
        run: |
          DEST=$(xcrun simctl list devices available iPhone -j \
            | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          runtime = 'com.apple.CoreSimulator.SimRuntime.iOS-26-2'
          for d in data.get('devices', {}).get(runtime, []):
              if d.get('isAvailable') and 'iPhone' in d.get('name',''):
                  print(f\"platform=iOS Simulator,id={d['udid']}\")
                  sys.exit(0)
          sys.exit('No available iPhone simulator with iOS 26.2 for Xcode 26.3')
          ")
          echo "Destination: $DEST"
          set -o pipefail
          xcodebuild test \
            -project GdeiAssistant-iOS.xcodeproj \
            -scheme GdeiAssistant-iOS \
            -destination "$DEST" \
            CODE_SIGNING_ALLOWED=NO \
            -resultBundlePath TestResults.xcresult \
            2>&1 | tee xcodebuild-test.log

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-test-results
          path: |
            TestResults.xcresult
            xcodebuild-test.log
          retention-days: 3
